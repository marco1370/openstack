[DEFAULT]
log_dir = /var/log/cinder
transport_url = rabbit://guest:guest@rabbitmq:5672
auth_strategy = keystone
my_ip = 0.0.0.0
enabled_backends = ceph
glance_api_servers = http://glance:9292
glance_api_version = 2

[database]
connection = mysql+pymysql://cinder:cinderpass@mariadb/cinder

[keystone_authtoken]
auth_url = http://keystone:5000
project_domain_name = Default
user_domain_name = Default
project_name = service
username = cinder
password = cinderpass
auth_type = password
memcached_servers = memcached:11211

[oslo_concurrency]
lock_path = /var/lib/cinder/tmp

[ceph]
volume_driver = cinder.volume.drivers.rbd.RBDDriver
volume_backend_name = ceph
rbd_pool = volumes
rbd_ceph_conf = /etc/ceph/ceph.conf
rbd_flatten_volume_from_snapshot = false
rbd_max_clone_depth = 5
rbd_store_chunk_size = 4
rados_connect_timeout = -1
rbd_user = cinder
rbd_keyring_conf = /etc/ceph/ceph.client.cinder.keyring

[backup]
backup_driver = cinder.backup.drivers.ceph.CephBackupDriver
backup_ceph_conf = /etc/ceph/ceph.conf
backup_ceph_user = cinder-backup
backup_ceph_pool = backups
backup_ceph_keyring = /etc/ceph/ceph.client.cinder-backup.keyring
